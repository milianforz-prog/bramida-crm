<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прокат CRM</title>
<meta name="description" content="CRM проката автомобилей: брони, клиенты, деньги, договоры.">
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Прокат CRM">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css?v=2">
<style>
/* Layout: graphite sidebar (desktop) / bottom tab bar (phone) + one working column up to 1180px. Garage-night graphite frames the app; road-marking yellow is the single action colour; status colours carry meaning only. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F3F4F7; --surface-3:#E7EAEF; --line:#E3E6EB; --line-2:#D2D7DF;
  --ink:#101318; --ink-2:#5A6371; --ink-3:#8E96A3;
  --accent:#FFC21A; --accent-ink:#1D1600; --accent-soft:#FFF1C2; --accent-text:#865F00;
  --ok:#128650; --ok-soft:#DCF2E6; --warn:#B26A00; --warn-soft:#FCEACB; --bad:#CF3A2C; --bad-soft:#FBE0DC;
  --info:#2A66D6; --info-soft:#E0EAFB; --violet:#6C4FD4; --violet-soft:#EAE4FB;
  --side:#14171C; --side-2:#1E222A; --side-ink:#EDF0F4; --side-ink-2:#8F97A5; --side-line:#262B34;
  --hero:#14171C; --hero-2:#232831; --plate-bg:#FFFFFF; --plate-ink:#111111; --paper:#FFFFFF; --paper-ink:#111111;
  --sh-1:0 1px 2px rgba(16,19,24,.05),0 8px 24px rgba(16,19,24,.06); --sh-2:0 30px 70px rgba(16,19,24,.25); --focus:0 0 0 3px rgba(255,194,26,.55);
  --av0b:#FFEDB8; --av0:#7A5600; --av1b:#DCE8FF; --av1:#1E4CA8; --av2b:#DDF3E5; --av2:#11683F; --av3b:#F7E1F4; --av3:#8A2A7C; --av4b:#FFE3D5; --av4:#9A3B0E; --av5b:#E5E1FA; --av5:#4A36A6;
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-ui:"Onest","Segoe UI",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; --f-doc:"PT Serif","Times New Roman",Georgia,serif;
  --r-lg:16px; --r:12px; --r-sm:9px; --side-w:236px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0D11; --surface:#14171D; --surface-2:#191D24; --surface-3:#222731; --line:#232832; --line-2:#2F3541;
  --ink:#EEF1F5; --ink-2:#A3AAB7; --ink-3:#6D7583;
  --accent:#FFC21A; --accent-ink:#1D1600; --accent-soft:#372D08; --accent-text:#FFC93D;
  --ok:#4CC489; --ok-soft:#11301F; --warn:#F0AA45; --warn-soft:#3A2A10; --bad:#F2776B; --bad-soft:#3D1915;
  --info:#73A8F6; --info-soft:#14243E; --violet:#A996F4; --violet-soft:#241E40;
  --side:#08090C; --side-2:#16191F; --side-ink:#EDF0F4; --side-ink-2:#858D9B; --side-line:#1D2128;
  --sh-1:0 0 0 1px #20252E; --sh-2:0 30px 70px rgba(0,0,0,.6); --hero:#1C1A12; --hero-2:#2E2A1C;
  --av0b:#3B3010; --av0:#FFD25E; --av1b:#16284A; --av1:#8DB5FF; --av2b:#12301F; --av2:#6FD9A2; --av3b:#3A1A35; --av3:#F19BE3; --av4b:#3E2112; --av4:#FFAA7D; --av5b:#251F45; --av5:#B5A6FF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0D11; --surface:#14171D; --surface-2:#191D24; --surface-3:#222731; --line:#232832; --line-2:#2F3541;
  --ink:#EEF1F5; --ink-2:#A3AAB7; --ink-3:#6D7583;
  --accent:#FFC21A; --accent-ink:#1D1600; --accent-soft:#372D08; --accent-text:#FFC93D;
  --ok:#4CC489; --ok-soft:#11301F; --warn:#F0AA45; --warn-soft:#3A2A10; --bad:#F2776B; --bad-soft:#3D1915;
  --info:#73A8F6; --info-soft:#14243E; --violet:#A996F4; --violet-soft:#241E40;
  --side:#08090C; --side-2:#16191F; --side-ink:#EDF0F4; --side-ink-2:#858D9B; --side-line:#1D2128;
  --sh-1:0 0 0 1px #20252E; --sh-2:0 30px 70px rgba(0,0,0,.6); --hero:#1C1A12; --hero-2:#2E2A1C;
  --av0b:#3B3010; --av0:#FFD25E; --av1b:#16284A; --av1:#8DB5FF; --av2b:#12301F; --av2:#6FD9A2; --av3b:#3A1A35; --av3:#F19BE3; --av4b:#3E2112; --av4:#FFAA7D; --av5b:#251F45; --av5:#B5A6FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100%}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus)}
h1,h2,h3{margin:0;text-wrap:balance}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
@keyframes rise{from{transform:translateY(6px);opacity:.35}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);border-right:1px solid var(--side-line);color:var(--side-ink);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px/1 var(--f-display);flex:none}
.brand b{display:block;font:600 13.5px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--side-ink);white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--side-ink-2);margin-top:3px}
.brand small::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#4CC489;margin-right:6px;vertical-align:1px}
.brand small.off::before{background:#F2776B}
.side .new{margin:2px 4px 14px;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink-2);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--side-2);color:var(--side-ink)}
.nav button.on{background:var(--side-2);color:var(--side-ink)}
.nav button.on .ic{color:var(--accent)}
.nav .lbl{flex:1}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge:empty{display:none}
.side-sp{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--side-line);color:var(--side-ink-2);font-size:13px;min-width:0}
.me img{width:30px;height:30px;border-radius:50%;flex:none}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{margin-left:var(--side-w);min-height:100vh}
.mtop{display:none}
.tabbar{display:none}
main{max-width:1180px;margin:0 auto;padding-block:26px 70px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
@media (max-width:960px){
  .side{display:none}
  .app{margin-left:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--side)}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:10px;background:var(--side);color:var(--side-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;flex:1;min-width:0}
  .mtop .mark{width:32px;height:32px;font-size:15px}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -8px 24px rgba(0,0,0,.06)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative;border-radius:10px}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on .ic{color:var(--accent-text)}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px}
}

/* ---------- page head ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:20px}
.ph h1{font:600 26px/1.15 var(--f-display);letter-spacing:-.02em;margin-right:auto}
.ph .eyebrow{display:block;font:500 12.5px/1 var(--f-ui);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.ph-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:600px){.ph h1{font-size:21px}}
.ro{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-weight:500}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.2;transition:background .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(255,194,26,.28)}
.btn.primary:hover{background:#FFCC3D}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.mtop .icon-btn{color:var(--side-ink)}
.mtop .icon-btn.primary{background:var(--accent);color:var(--accent-ink)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-height:40px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-2)}
.search{position:relative;min-width:0;flex:1 1 240px;max-width:340px}
.search input{padding-left:36px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .n{font-size:11.5px;color:var(--ink-3);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px;min-width:0;animation:rise .35s ease both}
.card > h2,.card-h{display:flex;align-items:center;gap:10px;font:600 15px/1.2 var(--f-ui);margin-bottom:14px}
.card-h .count,.card > h2 .count{font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface-3);border-radius:8px;padding:2px 7px}
.card-h .count:empty,.card > h2 .count:empty{display:none}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-today{display:grid;gap:16px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
@media (max-width:1060px){.grid-today{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:1060px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis{gap:10px}}
.kpi{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px;min-width:0;display:flex;flex-direction:column;gap:6px;animation:rise .35s ease both;position:relative;overflow:hidden}
.kpi .k-l{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.kpi .k-l .ic{width:16px;height:16px;color:var(--ink-3)}
.kpi .k-v{font:600 24px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--ink-3);line-height:1.35}
.kpi.hero{background:var(--hero);color:var(--side-ink);box-shadow:none}
.kpi.hero .k-l{color:var(--side-ink-2)}.kpi.hero .k-l .ic{color:var(--accent)}.kpi.hero .k-s{color:var(--side-ink-2)}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:2px}
.spark i{flex:1;background:var(--surface-3);border-radius:3px 3px 1px 1px;min-height:3px}
.spark i.v{background:var(--accent)}
.kpi.hero .spark i{background:var(--hero-2)}.kpi.hero .spark i.v{background:var(--accent)}
.ring{display:flex;align-items:center;gap:12px}
.ring svg{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}

/* list rows */
.list{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:6px 14px;padding:12px 10px;border:0;border-radius:12px;background:none;text-align:left;width:100%;cursor:pointer;min-width:0;transition:background .12s}
.row + .row{box-shadow:0 -1px 0 var(--line)}
.row:hover{background:var(--surface-2)}
.row:hover + .row{box-shadow:none}
.row b{font-weight:600}
.row .sub{display:block;color:var(--ink-2);font-size:12.5px;margin-top:1px}
.r-main{display:flex;align-items:center;gap:12px;min-width:0}
.r-main > span{min-width:0}
.r-main b,.r-main .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.right{text-align:right}
.bk-row{grid-template-columns:minmax(0,1.5fr) auto minmax(0,.9fr) auto minmax(120px,auto)}
.cl-row{grid-template-columns:minmax(0,1.5fr) auto auto minmax(100px,auto)}
.mv-row{grid-template-columns:86px minmax(0,1.4fr) minmax(0,.8fr) auto}
.tk-row{grid-template-columns:30px minmax(0,1fr) auto auto;cursor:default}
@media (max-width:760px){
  .bk-row{grid-template-columns:minmax(0,1fr) auto}
  .bk-row .c-dates,.bk-row .c-plate{display:none}
  .cl-row{grid-template-columns:minmax(0,1fr) auto}
  .cl-row .c-hide{display:none}
  .mv-row{grid-template-columns:minmax(0,1fr) auto}
  .mv-row .c-hide{display:none}
  .tk-row{grid-template-columns:30px minmax(0,1fr) auto}
  .tk-row .c-hide{display:none}
}
.up-row{grid-template-columns:minmax(0,1fr) auto;cursor:default}
.up-act{display:flex;gap:6px}
@media (max-width:600px){.up-row{grid-template-columns:minmax(0,1fr)}.up-row .r-main b,.up-row .r-main .sub{white-space:normal}.up-act{padding-left:42px}.hide-sm{display:none!important}}
.empty{padding:30px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .e-ic{width:52px;height:52px;border-radius:16px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3);margin-bottom:6px}
.empty b{color:var(--ink);font-size:15px}
.empty .btn{margin-top:10px}

/* avatars, plates, pills */
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:600 13.5px/1 var(--f-display);flex:none;letter-spacing:-.02em}
.av.sm{width:30px;height:30px;border-radius:9px;font-size:11.5px}
.av.lg{width:52px;height:52px;border-radius:16px;font-size:18px}
.av0{background:var(--av0b);color:var(--av0)}.av1{background:var(--av1b);color:var(--av1)}.av2{background:var(--av2b);color:var(--av2)}.av3{background:var(--av3b);color:var(--av3)}.av4{background:var(--av4b);color:var(--av4)}.av5{background:var(--av5b);color:var(--av5)}
.plate{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.05em;color:var(--plate-ink);background:var(--plate-bg);border:1.5px solid var(--plate-ink);border-radius:5px;padding:2px 7px;white-space:nowrap;line-height:1.3}
.plate.big{font-size:17px;padding:4px 11px;border-width:2px;border-radius:7px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.nodot::before{display:none}
.st-request{background:var(--surface-3);color:var(--ink-2)}
.st-confirmed{background:var(--info-soft);color:var(--info)}
.st-issued{background:var(--accent-soft);color:var(--accent-text)}
.st-returned{background:var(--violet-soft);color:var(--violet)}
.st-closed{background:var(--ok-soft);color:var(--ok)}
.st-cancelled{background:var(--surface-3);color:var(--ink-3);text-decoration:line-through}
.p-free{background:var(--ok-soft);color:var(--ok)}.p-out{background:var(--accent-soft);color:var(--accent-text)}.p-service{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-info{background:var(--info-soft);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* progress */
.bar-t{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden;position:relative}
.bar-t > i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent);transition:width .4s ease}
.bar-t.ok > i{background:var(--ok)}.bar-t.bad > i{background:var(--bad)}.bar-t.info > i{background:var(--info)}
.bar-t.live > i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;border-radius:6px;background:rgba(255,255,255,.55);animation:pulse 1.6s ease infinite}

/* today */
.rent{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s}
.rent:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.rent + .rent{margin-top:10px}
.rent-top{display:flex;align-items:center;gap:12px;min-width:0}
.rent-top > div{flex:1;min-width:0}
.rent-top b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rent-top .sub{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12.5px;margin-top:3px;flex-wrap:wrap}
.rent-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.rent-meta b{color:var(--ink);font-weight:600;font-size:13px}
.rent-meta b.bad{color:var(--bad)}
.rent-act{display:flex;gap:8px;flex-wrap:wrap}
.rent-act .btn{flex:1;justify-content:center}
.todo{display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border:0;background:none;text-align:left;width:100%;cursor:pointer;border-radius:12px}
.td + .td{box-shadow:0 -1px 0 var(--line)}
.td:hover{background:var(--surface-2)}
.td:hover + .td{box-shadow:none}
.td .t-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.td b{display:block;font-weight:600}
.td .sub{display:block;color:var(--ink-2);font-size:12.5px;margin-top:1px}
.td .go{color:var(--ink-3)}
.sev0 .t-ic{background:var(--bad-soft);color:var(--bad)}.sev1 .t-ic{background:var(--warn-soft);color:var(--warn)}.sev2 .t-ic{background:var(--info-soft);color:var(--info)}
.allgood{display:flex;align-items:center;gap:14px;padding:12px 6px}
.allgood .t-ic{width:44px;height:44px;border-radius:14px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

/* calendar */
.cal-scroll{overflow-x:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.cal{position:relative}
.cal-row{display:flex;border-bottom:1px solid var(--line);min-height:60px}
.cal-row:last-child{border-bottom:0}
.cal-car{position:sticky;left:0;z-index:3;width:var(--carw,170px);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.cal-car small{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.dot.free{background:var(--ok)}.dot.out{background:var(--accent)}.dot.service{background:var(--warn)}
.cal-track{position:relative;flex:none;cursor:copy}
.cal-track .cells{position:absolute;inset:0;display:flex;pointer-events:none}
.cal-track .cells i{flex:none;border-left:1px solid var(--line)}
.cal-track .cells i.we{background:var(--surface-2)}
.cal-track .cells i.td{background:var(--accent-soft);opacity:.55}
.cal-head{min-height:52px;position:sticky;top:0;z-index:4}
.cal-head .cal-track{display:flex;cursor:default;background:var(--surface)}
.cal-day{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink-3);border-left:1px solid var(--line);line-height:1.15;text-transform:uppercase;letter-spacing:.04em}
.cal-day b{font:600 14px/1.2 var(--f-display);color:var(--ink);letter-spacing:-.02em;text-transform:none}
.cal-day.we{background:var(--surface-2)}
.cal-day.today{background:var(--accent)}
.cal-day.today b,.cal-day.today span{color:var(--accent-ink)}
.bar{position:absolute;top:9px;height:42px;border-radius:12px;border:0;padding:0 10px 0 5px;display:flex;align-items:center;gap:8px;font-size:12px;overflow:hidden;white-space:nowrap;cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s;z-index:2}
.bar:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.12);z-index:3}
.bar .av{width:30px;height:30px;border-radius:9px;font-size:11px;background:rgba(255,255,255,.65);color:inherit}
.bar b{display:block;font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.bar small{display:block;font-size:11px;opacity:.8}
.bar.st-issued{background:var(--accent);color:var(--accent-ink)}
.bar.st-confirmed{background:var(--info);color:#fff}
.bar.st-confirmed .av,.bar.st-returned .av{background:rgba(255,255,255,.22)}
.bar.st-request{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.bar.st-returned{background:var(--violet);color:#fff}
.bar.st-closed{background:var(--ok-soft);color:var(--ok)}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1;pointer-events:none}
.now-line::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* cars */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
@media (max-width:420px){.cars{grid-template-columns:minmax(0,1fr)}}
.car{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-width:0;overflow:hidden;animation:rise .35s ease both;transition:transform .15s,box-shadow .15s}
.car:hover{transform:translateY(-2px);box-shadow:var(--sh-1),0 14px 30px rgba(0,0,0,.08)}
.car-hero{background:var(--hero);color:var(--side-ink);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.car-hero::after{content:"";position:absolute;right:-30px;bottom:-60px;width:220px;height:140px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,194,26,.22),transparent)}
.car-hero h3{font:600 19px/1.15 var(--f-display);letter-spacing:-.02em}
.car-hero .sub{color:var(--side-ink-2);font-size:12.5px;margin-top:4px}
.car-hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.car-hero .st{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.car-hero .st .line{display:flex;align-items:center;gap:10px;font-size:13px}
.car-hero .bar-t{background:var(--hero-2)}
.car-body{padding:16px 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.car-body .m span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.car-body .m b{display:block;font:600 15px/1.3 var(--f-display);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.car-ins{grid-column:1/-1;display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ins{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.ins span{color:var(--ink-2);font-weight:600}

/* money chart */
.chart{width:100%;height:auto;display:block}
.chart text{font:500 10px var(--f-ui);fill:var(--ink-3)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .rv{fill:var(--accent)}
.chart .ex{fill:var(--bad);opacity:.8}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.cat .bar-t{grid-column:1/-1;height:6px}
.cat .bar-t > i{background:var(--bad);opacity:.75}

/* drawer */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.5);display:flex;justify-content:flex-end;animation:fade .15s ease;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:min(780px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--sh-2);animation:slide .22s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.narrow{width:min(480px,100%)}
.sheet.wide{width:min(1000px,100%)}
.ov.bottom{align-items:center;justify-content:center;padding:16px}
.ov.bottom .sheet{height:auto;max-height:80vh;width:min(480px,100%);border-radius:20px;overflow:hidden;animation:up .22s cubic-bezier(.2,.8,.2,1);padding:0}
@media (max-width:600px){.ov.bottom{align-items:flex-end;padding:0}.ov.bottom .sheet{border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:18px max(22px,env(safe-area-inset-right,0px)) 16px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh-head > div{flex:1;min-width:0}
.sh-head h2{font:600 19px/1.25 var(--f-display);letter-spacing:-.02em;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sh-head .sub{margin:5px 0 0;color:var(--ink-2);font-size:13px}
.sh-body{flex:1;overflow-y:auto;padding:18px max(22px,env(safe-area-inset-right,0px)) 26px 22px;display:flex;flex-direction:column;gap:14px}
.sh-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px max(22px,env(safe-area-inset-right,0px)) 12px 22px;background:var(--surface);border-top:1px solid var(--line)}
.sh-foot .sp{flex:1}
@media (max-width:560px){.sh-foot{justify-content:flex-end}.sh-foot .sp{display:none}.sh-foot .btn{padding:8px 12px}}
.box{background:var(--surface);border-radius:14px;box-shadow:var(--sh-1);padding:16px}
.box h3{font:600 14.5px/1.2 var(--f-ui);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.box h3 .ic{color:var(--ink-3)}
.box h3 .r{margin-left:auto;font:500 12.5px var(--f-ui);color:var(--ink-3)}

/* stepper */
.steps{display:flex;list-style:none;margin:0;padding:14px 22px 0;background:var(--surface);gap:0;counter-reset:s}
.steps li{flex:1;position:relative;padding:0 0 14px;font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center;min-width:0}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font:600 12px/1 var(--f-display);position:relative;z-index:1}
.steps li::after{content:"";position:absolute;top:13px;left:calc(-50% + 16px);right:calc(50% + 16px);height:2px;background:var(--surface-3)}
.steps li:first-child::after{display:none}
.steps li.done{color:var(--ink-2)}
.steps li.done::before{content:"✓";background:var(--ok);color:#fff}
.steps li.done::after,.steps li.cur::after{background:var(--ok)}
.steps li.cur{color:var(--ink)}
.steps li.cur::before{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft)}
.steps.cancelled li{opacity:.45}
@media (max-width:520px){.steps li{font-size:10px}.steps{padding-inline:10px}}
.next{display:flex;gap:14px;align-items:flex-start;background:var(--hero);color:var(--side-ink);border-radius:14px;padding:16px}
.next .n-ic{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.next b{display:block;font:600 15px/1.3 var(--f-display);letter-spacing:-.01em}
.next p{margin:4px 0 0;color:var(--side-ink-2);font-size:13px}
.next .btn{margin-top:12px}
.next > div{flex:1;min-width:0}
.next.done .n-ic{background:var(--ok);color:#fff}

/* form grid */
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld small{color:var(--ink-3);font-size:11.5px}
.check{display:flex;align-items:center;gap:9px;font-weight:500;min-height:40px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--accent);flex:none}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline > .fld{flex:1}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.g2{grid-template-columns:minmax(0,1fr)}.span3{grid-column:1/-1}}
@media (max-width:440px){.grid{grid-template-columns:minmax(0,1fr)}.span2{grid-column:1/-1}}
.calc{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13.5px}
.calc .big{font:600 20px/1.1 var(--f-display);letter-spacing:-.02em}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks:empty{display:none}
.ck{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:9px}
.ck::before{font-weight:800;flex:none}
.ck.ok{background:var(--ok-soft);color:var(--ok)}.ck.ok::before{content:"✓"}
.ck.warn{background:var(--warn-soft);color:var(--warn)}.ck.warn::before{content:"!"}
.ck.bad{background:var(--bad-soft);color:var(--bad)}.ck.bad::before{content:"✕"}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kv .tot{border-top:1px solid var(--line);padding-top:8px}
.paid{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.paid-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.paid-top b{font:600 20px/1.1 var(--f-display);letter-spacing:-.02em}
.mini{display:flex;flex-direction:column}
.mini-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:9px 0;font-size:13.5px}
.mini-row + .mini-row{border-top:1px solid var(--line)}
.mini-row .m-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.mini-row .m-ic.in{background:var(--ok-soft);color:var(--ok)}.mini-row .m-ic.out{background:var(--bad-soft);color:var(--bad)}.mini-row .m-ic.dep{background:var(--info-soft);color:var(--info)}
.mini-row .sub{display:block;color:var(--ink-2);font-size:12px}
.mini-row.link{cursor:pointer;border-radius:10px}
.mini-row.link:hover{background:var(--surface-2)}
.x{border:0;background:none;color:var(--ink-3);cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.suggest span{flex:1;min-width:180px}
.addrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.addrow.pay{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,.9fr) auto}
@media (max-width:620px){.addrow,.addrow.pay{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addrow .btn{grid-column:1/-1;justify-content:center}}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font:600 16px/1.2 var(--f-display);letter-spacing:-.01em}
.who .sub{color:var(--ink-2);font-size:12.5px;margin-top:3px;display:block}

/* settings */
.set-grid{display:flex;flex-direction:column;gap:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
@media (max-width:960px){#toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
.tst{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-ink);padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:var(--sh-2);animation:up .2s ease}
.tst .ic{color:var(--accent)}
.tst.bad{background:var(--bad);color:#fff}.tst.bad .ic{color:#fff}
.skel{height:14px;border-radius:7px;background:var(--surface-3);margin:12px 0;animation:pulse 1.4s ease infinite}


/* ---------- app shell (PWA) ---------- */
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
main{padding-top:calc(26px + env(safe-area-inset-top,0px))}
@media (max-width:960px){main{padding-top:18px}input,select,textarea{font-size:16px}}
.me > span:not(.av){flex:1;min-width:0;color:var(--side-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{display:block;font-size:11px;color:var(--side-ink-2)}
.me .av{background:var(--side-2);color:var(--side-ink)}
.me .icon-btn{color:var(--side-ink-2)}
.me .icon-btn:hover{background:var(--side-2);color:var(--side-ink)}
.auth{display:none}
body.signed-out .side,body.signed-out .app{display:none}
body.signed-out .auth{display:flex}
.auth{min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--side)}
.auth-card{width:min(420px,100%);background:var(--surface);border-radius:22px;padding:26px;box-shadow:var(--sh-2);display:flex;flex-direction:column;gap:18px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.auth-card .brand{padding:0}
.auth-card .brand b{color:var(--ink);font-size:15px}
.auth-card .brand small{color:var(--ink-3)}
.auth-card .brand small::before{display:none}
.auth-card .seg{display:flex}
.auth-card .seg button{flex:1;justify-content:center}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form p{margin:0;font-size:13px}
.auth-form .btn{justify-content:center;padding:12px;margin-top:4px}
.auth-err{color:var(--bad);font-size:13px;font-weight:500}
.auth-err:empty{display:none}
.auth-foot{margin:0;font-size:12.5px}
.install{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:16px;animation:rise .35s ease both}
.install .i-ic{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.install > span{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.install b{display:block;font-weight:600;color:var(--ink);font-size:14px}
@media (max-width:600px){.install{gap:10px;padding:10px 10px 10px 12px}.install .i-sub{display:none}.install .i-ic{width:34px;height:34px;border-radius:10px}}
.team-row{grid-template-columns:32px minmax(0,1fr) minmax(140px,auto) auto}
.team-row select{min-height:34px;padding:5px 8px;font-size:13px;width:auto}
.team-act{display:flex;gap:2px;align-items:center}
.addrow.team-add{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr) auto}
.brand.can-switch{cursor:pointer;border-radius:12px;margin:-4px;padding:4px}
.side .brand.can-switch{margin:0 0 4px;padding:6px 6px 16px}
.side .brand.can-switch:hover{background:var(--side-2)}
.brand .org-switch{margin-left:auto;color:var(--side-ink-2);display:grid;place-items:center}
.brand b.org-name{overflow:hidden;text-overflow:ellipsis}
.side .brand b.org-name{white-space:normal;line-height:1.2}
.brand small.sync{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------- booking maths ---------------- */
function bkDays(b) {
  if (num(b.daysOverride)) return num(b.daysOverride);
  const s = parse(b.start), e = parse(b.end);

  return Math.max(1, Math.ceil((e - s) / 864e5 - 1e-6));
}
const bkRent = b => b.status === 'cancelled' ? 0 : Math.max(0, bkDays(b) * (num(b.price) || 0) - (num(b.discount) || 0));
const bkCharges = b => (b.charges || []).reduce((a, c) => a + (num(c.amount) || 0), 0);
function bkPays(id) { return list('payments').filter(p => p.bookingId === id).sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.createdAt).localeCompare(String(b.createdAt))); }
function money(b) {
  const ps = bkPays(b.id);
  const sum = t => ps.filter(p => p.type === t).reduce((a, p) => a + (num(p.amount) || 0), 0);
  const rent = bkRent(b), ch = bkCharges(b), owed = rent + ch;
  const paid = sum('pay') + sum('deposit_keep');
  const depIn = sum('deposit_in'), depOut = sum('deposit_out'), depKeep = sum('deposit_keep');

}
function overlaps(b, selfId) {

    .filter(o => { const os = parse(o.start), oe = parse(o.end); return os && oe && s < oe && os < e; });
}

}
function rentProgress(b) {

  if (!s || !e) return { p: 0, left: 0, over: false };
  const p = Math.max(0, Math.min(1, (now - s) / (e - s || 1)));

}
function clientChecks(c, atEnd) {
  const out = [];
  if (!c) return out;
  if (c.stop) out.push(['bad', 'Стоп-лист' + (c.stopReason ? ': ' + c.stopReason : '')]);
  const minAge = num(S.settings.minAge), minExp = num(S.settings.minExp);
  const age = yearsSince(c.birthDate), exp = yearsSince(c.license && c.license.bSince);
  if (age !== null) out.push([minAge && age < minAge ? 'bad' : 'ok', `${Math.floor(age)} ${plural(Math.floor(age), ['год', 'года', 'лет'])}` + (minAge && age < minAge ? ` (нужно от ${minAge})` : '')]);
  else out.push(['warn', 'Нет даты рождения']);
  if (exp !== null) out.push([minExp && exp < minExp ? 'bad' : 'ok', `стаж ${exp.toFixed(1).replace('.', ',')} г.` + (minExp && exp < minExp ? ` (нужно от ${minExp})` : '')]);
  else out.push(['warn', 'Нет стажа категории B']);
  const vt = parse(c.license && c.license.validTo);

  else out.push(['warn', 'Нет срока действия прав']);

}
function insChecks(car, until) {
  const out = [];
  if (!car) return out;

  [['osago', 'ОСАГО'], ['kasko', 'КАСКО']].forEach(([k, label]) => {
    const p = car[k] || {}; const to = parse(p.to);
    if (!p.no && !to) { if (k === 'osago') out.push(['bad', 'Нет данных ОСАГО']); return; }
    if (!to) return;
    const end = new Date(to); end.setHours(23, 59, 59);
    if (end < now) out.push(['bad', `${label} истёк ${fmtD(p.to)}`]);
    else if (until && end < until) out.push(['bad', `${label} закончится ${fmtD(p.to)} — раньше конца брони`]);
    else if ((end - now) / 864e5 <= 30) out.push(['warn', `${label} до ${fmtD(p.to)} — осталось ${Math.ceil((end - now) / 864e5)} дн.`]);

  }
  const cmin = num(S.settings.chargeMin), cpen = num(S.settings.chargePenalty);

/* ---------------- alerts ---------------- */
const TAG_IC = { 'Просрочка': 'alert', 'Сегодня': 'clock', 'Завтра': 'clock', 'Залог': 'lock', 'Долг': 'ruble', 'Оплата': 'ruble', 'Страховка': 'shield', 'Задача': 'tasks', 'Заявка': 'key', 'Закрыть': 'check', 'Выдача': 'key', 'Стоп-лист': 'alert', 'Бронь': 'calendar' };
function buildAlerts() {
  const now = new Date(), t0 = sod(now), t2 = addDays(t0, 2);
  const A = [];
  const push = (sev, tag, title, sub, act, id, at) => A.push({ sev, tag, title, sub, act, id, at: at || 0 });
  const depDays = num(S.settings.depositDays) || 14;
  list('bookings').forEach(b => {
    const c = S.clients[b.clientId], car = S.cars[b.carId];
    const who = `№${b.no || '—'} · ${shortName(c && c.name) || 'клиент?'} · ${car ? car.plate || carLabel(car) : 'машина?'}`;
    const s = parse(b.start), e = parse(b.end);
    if (b.status === 'cancelled') return;
    const m = money(b);
    if (b.status === 'issued' && e) {
      if (e < now) push(0, 'Просрочка', 'Машину не вернули', `${who} · ждали ${fmtDT(b.end)}, прошло ${dur(now - e)}`, 'open-booking', b.id, +e);
      else if (e < addDays(t0, 1)) push(1, 'Сегодня', `Возврат в ${hm(e)}`, who, 'open-booking', b.id, +e);
      else if (e < t2) push(2, 'Завтра', `Возврат в ${hm(e)}`, who, 'open-booking', b.id, +e);
      if ((num(b.deposit) || 0) > 0 && m.depIn === 0) push(1, 'Залог', 'Залог не получен', `${who} · по договору ${rub(b.deposit)}`, 'open-booking', b.id, +s);
      if (c && c.stop) push(0, 'Стоп-лист', 'Машина у клиента из стоп-листа', who, 'open-booking', b.id, +s);
    }
    if (['request', 'confirmed'].includes(b.status) && s) {
      if (s < now && (!e || e > now)) push(0, 'Выдача', 'Выдача не отмечена', `${who} · по плану ${fmtDT(b.start)}`, 'open-booking', b.id, +s);
      else if (e && e < now) push(1, 'Бронь', 'Срок прошёл, а выдачи не было', `${who} · отмените или отметьте выдачу`, 'open-booking', b.id, +s);
      else if (s < addDays(t0, 1) && s >= now) push(1, 'Сегодня', `Выдача в ${hm(s)}`, who, 'open-booking', b.id, +s);
      else if (s >= addDays(t0, 1) && s < t2) push(2, 'Завтра', `Выдача в ${hm(s)}`, who, 'open-booking', b.id, +s);
      if (b.status === 'request' && s >= now) push(2, 'Заявка', 'Подтвердить заявку', `${who} · ${fmtDT(b.start)} → ${fmtDT(b.end)}`, 'open-booking', b.id, +s);
      if (s < t2 && m.due > 0) push(1, 'Оплата', `Ждём оплату ${rub(m.due)}`, who, 'open-booking', b.id, +s);
      if (s < t2 && e) insChecks(car, e).filter(x => x[0] === 'bad').forEach(x => push(0, 'Страховка', x[1], who, 'open-booking', b.id, +s));
    }
    if (['issued', 'returned', 'closed'].includes(b.status) && m.due > 0) push(b.status === 'issued' ? 2 : 1, 'Долг', `Клиент должен ${rub(m.due)}`, who, 'open-booking', b.id, +e);
    if (['returned', 'closed'].includes(b.status) && m.depHeld > 0) {
      const back = parse(b.in && b.in.at) || e || now;
      const dueD = addDays(back, depDays);
      if (dueD < now) push(0, 'Залог', `Пора вернуть залог ${rub(m.depHeld)}`, `${who} · срок был ${fmtD(isoD(dueD))}`, 'open-booking', b.id, +dueD);
      else push(2, 'Залог', `Вернуть залог ${rub(m.depHeld)} до ${fmtD(isoD(dueD))}`, who, 'open-booking', b.id, +dueD);
    }
    if (b.status === 'returned' && m.due <= 0 && m.depHeld <= 0) push(2, 'Закрыть', 'Расчёт завершён — закройте бронь', who, 'open-booking', b.id, +e);
  });
  list('cars').forEach(car => {
    insChecks(car).filter(x => x[0] !== 'ok').forEach(x => push(x[0] === 'bad' ? 0 : 1, 'Страховка', x[1], `${carLabel(car)} · ${car.plate || ''}`, 'open-car', car.id, 0));

  });

}

const isTouch = () => window.matchMedia && matchMedia('(pointer:coarse)').matches;
function blobDownload(blob, filename) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const APP_DL = {
  save: ({ filename, data }) => new Promise((resolve, reject) => {
    const type = /\.pdf$/i.test(filename) ? 'application/pdf' : /\.html?$/i.test(filename) ? 'text/html' : 'application/octet-stream';
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    let file = null; try { file = new File([blob], filename, { type }); } catch (e) { file = null; }
    const canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
    if (!isTouch() || !canShare) { blobDownload(blob, filename); resolve({ status: 'saved' }); return; }
    let done = false;
    const m = openModal({ title: 'Файл готов', size: 'narrow', bottom: true,
      body: `<p style="margin:0;display:flex;gap:10px;align-items:center">${ic('doc')}<b style="word-break:break-word">${esc(filename)}</b></p><p class="muted" style="margin:0;font-size:13px">«Отправить» — переслать клиенту в мессенджер или сохранить в «Файлы».</p>`,
      foot: `<span class="sp"></span><button class="btn" data-f="dl">${ic('download', 'sm')}Скачать</button><button class="btn primary" data-f="share">${ic('share', 'sm')}Отправить</button>` });
    m.el.addEventListener('click', async e => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      if (b.dataset.f === 'dl') { blobDownload(blob, filename); done = true; closeTop(); resolve({ status: 'saved' }); return; }
      try { await navigator.share({ files: [file], title: filename }); done = true; closeTop(); resolve({ status: 'saved' }); }
      catch (err) { if (err && err.name === 'AbortError') return; blobDownload(blob, filename); done = true; closeTop(); resolve({ status: 'saved' }); }
    });
    const obs = new MutationObserver(() => { if (!m.el.isConnected) { obs.disconnect(); if (!done) reject(Object.assign(new Error('closed'), { code: 'declined' })); } });
    obs.observe($('#modal-root'), { childList: true });
  })
};

function moneyChart(mo) {
  const [y, m] = mo.split('-').map(Number); const n = new Date(y, m, 0).getDate();
  const inc = Array(n).fill(0), exp = Array(n).fill(0);
  list('payments').forEach(p => { if (String(p.date).startsWith(mo)) inc[Number(String(p.date).slice(8, 10)) - 1] += incomeOf(p); });
  list('expenses').forEach(x => { if (String(x.date).startsWith(mo)) exp[Number(String(x.date).slice(8, 10)) - 1] += num(x.amount) || 0; });
  const max = Math.max(1000, ...inc, ...exp);
  const step = [1000, 2000, 5000, 10000, 20000, 25000, 50000, 100000, 200000, 500000].find(s => max / s <= 4) || 1000000;
  const top = Math.ceil(max / step) * step;
  const W = 720, H = 200, L = 46, R = 8, T = 10, B = 24, cw = (W - L - R) / n, bw = Math.max(3, cw * .32);
  const Y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v >= 1000 ? groups(v / 1000) + 'k' : v}</text>`;
  let bars = '', labels = '';
  for (let i = 0; i < n; i++) {
    const x = L + i * cw + cw / 2;
    if (inc[i]) bars += `<rect class="rv" x="${x - bw - .5}" y="${Y(inc[i])}" width="${bw}" height="${Y(0) - Y(inc[i])}" rx="2"><title>${i + 1}.${pad(m)}: выручка ${rub(inc[i])}</title></rect>`;
    if (exp[i]) bars += `<rect class="ex" x="${x + .5}" y="${Y(exp[i])}" width="${bw}" height="${Y(0) - Y(exp[i])}" rx="2"><title>${i + 1}.${pad(m)}: расходы ${rub(exp[i])}</title></rect>`;
    if (i === 0 || (i + 1) % 5 === 0) labels += `<text x="${x}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка и расходы по дням">${g}${bars}${labels}</svg><div class="leg"><span><i style="background:var(--accent)"></i>Выручка</span><span><i style="background:var(--bad)"></i>Расходы</span></div>`;
}

  async function save(status) {
    const x = cur();
    if (!x.clientId) { toast('Выберите клиента', 'bad'); return; }
    if (!x.carId) { toast('Выберите машину', 'bad'); return; }
    if (!parse(x.start) || !parse(x.end)) { toast('Укажите начало и конец аренды', 'bad'); return; }
    if (parse(x.end) <= parse(x.start)) { toast('Конец аренды раньше начала', 'bad'); return; }
    if (status && status !== 'cancelled' && overlaps(x, b.id).length && !(await ask('Машина в эти даты уже занята другой бронью. Сохранить всё равно?', 'Сохранить', false))) return;
    if (status === 'issued') { x.out = x.out || {}; if (!x.out.at) x.out.at = isoDT(new Date()); }
    if (status === 'returned') {
      const cc = S.clients[x.clientId], ee = parse(x.end), early = ee && new Date() < ee;
      if (!(await ask(`Принять машину у ${shortName(cc && cc.name) || 'клиента'}?${early ? ` Срок аренды ещё не закончился — до ${fmtDT(x.end)}.` : ''} Бронь перейдёт в «Возвращена», машина освободится в календаре.`, 'Да, машина вернулась', false))) return;
      x.in = x.in || {}; if (!x.in.at) x.in.at = isoDT(new Date());
    }
    if (status === 'closed') { const mm = money(x); if ((mm.due > 0 || mm.depHeld > 0) && !(await ask(`Остался ${mm.due > 0 ? 'долг ' + rub(mm.due) : ''}${mm.due > 0 && mm.depHeld > 0 ? ' и ' : ''}${mm.depHeld > 0 ? 'залог на руках ' + rub(mm.depHeld) : ''}. Закрыть бронь всё равно?`, 'Закрыть', false))) return; }
    if (status === 'cancelled' && !(await ask('Отменить бронь? Машина освободится в календаре.', 'Отменить бронь'))) return;
    if (status) x.status = status;
    const id2 = b.id || newId('bookings');
    const data = { ...x }; delete data.id;
    if (b.id && S.bookings[b.id]) data.charges = S.bookings[b.id].charges || [];
    if (!b.id) { data.no = Math.max(0, ...list('bookings').map(z => num(z.no) || 0)) + 1; data.createdAt = new Date().toISOString(); data.createdBy = S.meId || null; data.charges = data.charges || []; }
    data.updatedAt = new Date().toISOString();
    if (await put('bookings', id2, data)) {
      S.bookings[id2] = data;

      closeTop(); openBooking(id2); schedule();
    }
  }
  m.el.addEventListener('click', async e => {
    const a = e.target.closest('[data-bk],[data-bkx],[data-ch-del],[data-pay-del],[data-sug]'); if (!a) return;
    e.preventDefault();
    const k = a.dataset.bk;

    if (k && k.startsWith('st:')) return save(k.slice(3));
    if (k === 'delete') { if (await ask(`Удалить бронь №${b.no}? Её платежи тоже удалятся.`)) { const ps = bkPays(b.id); for (const p of ps) await del('payments', p.id); if (await del('bookings', b.id)) { delete S.bookings[b.id]; closeTop(); toast('Бронь удалена'); schedule(); } } return; }
    if (k === 'contract') return openContract(cur());
    const saved = S.bookings[b.id];
    if (a.dataset.bkx === 'add-charge') {
      const amount = num($('#ch_amount', m.el).value); if (!amount) { toast('Укажите сумму', 'bad'); return; }
      const ch = [...(saved.charges || []), { id: rid(), type: $('#ch_type', m.el).value, amount, note: $('#ch_note', m.el).value.trim(), date: todayKey(), by: S.meId || null }];
      if (await patch('bookings', b.id, { charges: ch })) { S.bookings[b.id] = { ...saved, charges: ch }; toast('Начислено'); $('#ch_amount', m.el).value = ''; $('#ch_note', m.el).value = ''; live(); schedule(); }
      return;
    }
    if (a.dataset.sug !== undefined) {
      const s = (m._sug || [])[+a.dataset.sug]; if (!s) return;
      const ch = [...(saved.charges || []), { id: rid(), type: s.type, amount: s.amount, note: s.note, auto: s.auto, date: todayKey(), by: S.meId || null }];
      if (await patch('bookings', b.id, { charges: ch })) { S.bookings[b.id] = { ...saved, charges: ch }; toast('Начислено'); live(); schedule(); }
      return;
    }
    if (a.dataset.chDel) {
      if (!(await ask('Удалить начисление?'))) return;
      const ch = (saved.charges || []).filter(c => c.id !== a.dataset.chDel);
      if (await patch('bookings', b.id, { charges: ch })) { S.bookings[b.id] = { ...saved, charges: ch }; live(); schedule(); }
      return;
    }
    if (a.dataset.bkx === 'add-pay') {
      const amount = num($('#pay_amount', m.el).value); if (!amount || amount < 0) { toast('Укажите сумму платежа', 'bad'); return; }
      const type = $('#pay_type', m.el).value;
      const mm = money({ id: b.id, ...saved });
      if ((type === 'deposit_keep' || type === 'deposit_out') && amount > mm.depHeld && !(await ask(`На руках залога только ${rub(mm.depHeld)}. Провести ${rub(amount)}?`, 'Провести', false))) return;
      const pid = newId('payments');
      const data = { bookingId: b.id, clientId: saved.clientId || null, carId: saved.carId || null, type, amount, method: $('#pay_method', m.el).value, date: $('#pay_date', m.el).value || todayKey(), note: '', by: S.meId || null, createdAt: new Date().toISOString() };
      if (await put('payments', pid, data)) { S.payments[pid] = data; toast(`${PAY_T[type]}: ${rub(amount)}`); $('#bk-live', m.el).innerHTML = ''; live(); schedule(); }
      return;
    }
    if (a.dataset.payDel) {
      if (!(await ask('Удалить платёж?'))) return;
      if (await del('payments', a.dataset.payDel)) { delete S.payments[a.dataset.payDel]; live(); schedule(); }
    }
  });
  m.newClientCb = cid => { const sel = $('#bk_clientId', m.el); if (sel) { if (![...sel.options].some(o2 => o2.value === cid)) sel.add(new Option(S.clients[cid] ? S.clients[cid].name : 'Новый клиент', cid)); sel.value = cid; calc(); } };
  foot(); calc(); live();
  if (autoStatus && !isNew) save(autoStatus);
}

    ${F('osago.from', 'Действует с', os.from, { p: P, type: 'date' })}${F('osago.to', 'Действует по', os.to, { p: P, type: 'date' })}${F('osago.unlimited', 'Без ограничения водителей', os.unlimited, { p: P, type: 'check' })}

    ${F('notes', 'Заметки', c.notes, { p: P, type: 'textarea', span: 3 })}
  </form></section><div id="car-hist"></div>`;
  const can = S.canWrite;
  const m = openModal({ title: isNew ? 'Новая машина' : `${esc(carLabel(c))} ${plate(c)}`, body,

  const hist = () => {
    if (isNew) return;
    const bs = list('bookings').filter(b => b.carId === id && b.status !== 'cancelled').sort((a, b) => String(b.start).localeCompare(String(a.start)));
    const rev = list('payments').filter(p => p.carId === id).reduce((a, p) => a + incomeOf(p), 0);
    const ex = expSum(x => x.carId === id);
    const ts = list('tasks').filter(t => t.carId === id && !t.done);
    $('#car-sum', m.el).innerHTML = `<div class="kpis" style="margin:0;grid-template-columns:repeat(3,minmax(0,1fr))">${kpi('trend', 'Выручка, всего', rub(rev), `${bs.length} ${plural(bs.length, ['аренда', 'аренды', 'аренд'])}`, '', 'hero')}${kpi('minus', 'Расходы, всего', rub(ex), '')}${kpi('wallet', 'Прибыль', `<span class="${rev - ex < 0 ? 'bad' : 'ok'}">${rub(rev - ex)}</span>`, '')}</div>`;
    $('#car-hist', m.el).innerHTML = `<section class="box"><h3>${ic('key')}Брони</h3>${bs.length ? `<div class="mini">${bs.slice(0, 12).map(b => { const cl = S.clients[b.clientId]; return `<div class="mini-row link" data-act="open-booking" data-id="${b.id}">${avatar(cl && cl.name, 'sm')}<span><b>№${b.no || '—'} · ${esc(shortName(cl && cl.name) || '—')}</b><span class="sub">${fmtDT(b.start)} → ${fmtDT(b.end)}</span></span>${pill(b.status)}<b class="num">${rub(money(b).owed)}</b></div>`; }).join('')}</div>` : '<div class="muted">Броней пока нет.</div>'}</section>
      ${ts.length ? `<section class="box"><h3>${ic('tasks')}Открытые задачи</h3><div class="mini">${ts.map(t => `<div class="mini-row link" data-act="open-task" data-id="${t.id}"><span class="m-ic">${ic('tasks', 'sm')}</span><span><b>${esc(t.title)}</b><span class="sub">${esc(t.type || '')}</span></span><span class="muted">${t.due ? fmtD(t.due) : ''}</span><span></span></div>`).join('')}</div></section>` : ''}`;
  };
  m.refresh = hist; hist();
  m.el.addEventListener('click', async e => {
    const a = e.target.closest('[data-car]'); if (!a) return;
    const k = a.dataset.car;
    if (k === 'save') {
      const x = deepMerge(c, readForm($('#car-form', m.el)));
      if (!x.plate && !x.model) { toast('Укажите хотя бы модель или госномер', 'bad'); return; }
      const id2 = id || newId('cars');
      if (!id) x.createdAt = new Date().toISOString();
      x.updatedAt = new Date().toISOString();
      if (await put('cars', id2, x)) { S.cars[id2] = x; toast(isNew ? 'Машина добавлена' : 'Сохранено'); closeTop(); schedule(); }
    }
    if (k === 'book') { closeTop(); openBooking(null, { carId: id }); }
    if (k === 'task') { closeTop(); openTask(null, { carId: id }); }
    if (k === 'expense') { closeTop(); openExpense(null, { carId: id }); }
    if (k === 'delete') {
      if (list('bookings').some(b => b.carId === id)) { toast('У машины есть брони — сначала удалите их', 'bad'); return; }
      if (await ask(`Удалить ${carLabel(c)} ${c.plate || ''}?`) && await del('cars', id)) { delete S.cars[id]; closeTop(); toast('Машина удалена'); schedule(); }
    }
  });
}

/* ---------------- task drawer ---------------- */
function openTask(id, preset = {}) {
  const isNew = !id || !S.tasks[id];
  const t = isNew ? { type: 'Мойка', due: todayKey(), ...preset } : clone(S.tasks[id]);
  const P = 'tk';
  const body = `<section class="box"><form class="grid g2" id="tk-form" onsubmit="return false">
    ${F('title', 'Что сделать', t.title, { p: P, span: 2, ph: 'Помыть после возврата' })}
    ${F('type', 'Тип', t.type, { p: P, type: 'select', opts: TASK_T.map(x => [x, x]) })}
    ${F('carId', 'Машина', t.carId, { p: P, type: 'select', opts: [['', '— без машины —'], ...carsSorted().map(c => [c.id, `${c.plate || '—'} · ${carLabel(c)}`])] })}
    ${F('due', 'Срок', t.due, { p: P, type: 'date' })}
    ${F('done', 'Выполнено', t.done, { p: P, type: 'check' })}
    ${F('notes', 'Подробности', t.notes, { p: P, type: 'textarea', span: 2 })}
  </form></section>`;
  const can = S.canWrite;
  const m = openModal({ title: isNew ? 'Новая задача' : 'Задача', body, size: 'narrow',
    foot: `${!isNew && can ? '<button class="btn danger" data-tk="delete">Удалить</button>' : ''}<span class="sp"></span>${can ? `<button class="btn primary" data-tk="save">${ic('check', 'sm')}${isNew ? 'Добавить' : 'Сохранить'}</button>` : ''}` });
  m.el.addEventListener('click', async e => {
    const a = e.target.closest('[data-tk]'); if (!a) return;
    if (a.dataset.tk === 'save') {
      const x = { ...t, ...readForm($('#tk-form', m.el)) };
      if (!x.title) x.title = x.type;
      if (x.done && !t.done) x.doneAt = new Date().toISOString();
      if (!x.done) x.doneAt = null;
      const id2 = id || newId('tasks');
      if (!id) { x.createdAt = new Date().toISOString(); x.by = S.meId || null; }
      if (await put('tasks', id2, x)) { S.tasks[id2] = x; toast('Сохранено'); closeTop(); schedule(); }
    }
    if (a.dataset.tk === 'delete' && await ask('Удалить задачу?') && await del('tasks', id)) { delete S.tasks[id]; closeTop(); schedule(); }
  });
}

function contractHTML(b) {
  const s = S.settings, c = S.clients[b.clientId] || {}, car = S.cars[b.carId] || {};

  const term = v => { const d = parse(v); return d ? `${pad(d.getHours())} ч ${pad(d.getMinutes())} мин «${d.getDate()}» ${MONTHS_G[d.getMonth()]} ${d.getFullYear()} г.` : '___ ч ___ мин «___» __________ 20___ г.'; };

    : 'гражданин(ка) __________________________________, паспорт серия ______ № __________, выдан ______________________ «___» __________ ____ г., водительское удостоверение № ____________, именуемый(ая) в дальнейшем «Арендатор», с другой стороны,';
  const osText = os.no ? `по полису ОСАГО № ${esc(os.no)}, выданному ${B(os.insurer)}, действующему на территории Российской Федерации ${os.from ? 'с ' + fmtD(os.from) + ' ' : ''}по ${fmtD(os.to)}${os.unlimited ? '; к управлению допущено неограниченное количество лиц' : ''}.` : 'по полису № ______________, выданному __________________, действующему на территории Российской Федерации до «___» __________ 20___ г.';
  const ksText = ks.no ? ` КАСКО: полис № ${esc(ks.no)}, страховщик ${B(ks.insurer)}, срок действия ${ks.from ? 'с ' + fmtD(ks.from) + ' ' : ''}по ${fmtD(ks.to)}, франшиза ${N(ks.franchise, '________')} руб.` : ' КАСКО: __________ (есть / нет), франшиза ________ руб.';
  const sigName = esc(shortName(c.name)) || '________________';
  const repShort = s.repShort ? esc(s.repShort) : '________________';
  const o = b.out || {}, i = b.in || {};
  const cell = v => v === null || v === undefined || v === '' ? '' : esc(v);
  const dt = v => { const d = parse(v); return d ? `${fmtD(v)} ${hm(d)}` : ''; };
  return `
<h1>ДОГОВОР АРЕНДЫ</h1>
<div class="c-sub">транспортного средства без экипажа № ${B(b.no, '_____')}</div>
<div class="c-place"><span>${B(s.city, 'г. ________________')}</span><span>${ruDate(b.contractDate)}</span></div>
<p><b>${B(s.companyName, '________________')}</b>${s.companyCountry || s.unp ? ` (${[s.companyCountry, s.unp ? 'УНП ' + s.unp : ''].filter(Boolean).map(esc).join(', ')})` : ''}, именуемое в дальнейшем «Арендодатель», в лице ${B(s.repName, '__________________________')}, действующего на основании ${B(s.repBasis, '________________')}, с одной стороны, и</p>
<p>${lessee}</p>
<p>вместе именуемые «Стороны», заключили настоящий договор о нижеследующем.</p>
<h2>1. Предмет договора</h2>
<p>1.1. Арендодатель предоставляет Арендатору за плату во временное владение и пользование транспортное средство без оказания услуг по управлению и технической эксплуатации (далее — «Автомобиль»), а Арендатор обязуется вносить арендную плату и вернуть Автомобиль в том состоянии, в котором он его получил, с учётом нормального износа (ст. 642 ГК РФ).</p>
<p>1.2. Сведения об Автомобиле:</p>
<table class="t-kv"><tr><th>Параметр</th><th>Значение</th></tr>
<tr><td>Марка, модель</td><td>${esc([car.brand, car.model].filter(Boolean).join(' ')) || '____________'}${car.modification ? ', модификация ' + esc(car.modification) : ''}</td></tr>
<tr><td>Тип ТС</td><td>${B(car.type)}</td></tr><tr><td>Год выпуска</td><td>${B(car.year)}</td></tr>
<tr><td>VIN</td><td>${B(car.vin)}</td></tr><tr><td>Государственный регистрационный знак</td><td>${B(car.plate)}</td></tr>
<tr><td>Цвет</td><td>${B(car.color)}</td></tr><tr><td>Свидетельство о регистрации ТС</td><td>${B(car.sts, 'серия ______ № __________')}</td></tr>
<tr><td>Оценочная стоимость Автомобиля</td><td>${N(car.valuation, '____________')} руб.</td></tr></table>
<p>1.3. Автомобиль принадлежит Арендодателю на праве собственности. На момент заключения договора он не продан, не заложен, не арестован и не обременён правами третьих лиц.</p>
<p>1.4. Автомобиль предоставляется Арендатору для личных нужд. Запрещено использовать его в такси, каршеринге, для перевозки пассажиров или грузов за плату, обучения вождению, участия в соревнованиях и коммерческих съёмках без письменного согласия Арендодателя.</p>
<p>1.5. Территория использования: ${B(s.territory, '________________')}. Выезд за её пределы допускается только с письменного согласия Арендодателя (в том числе в мессенджере).</p>
<p>1.6. Управлять Автомобилем вправе только Арендатор и лица, указанные в акте приёма-передачи как допущенные к управлению. Возраст водителя — не менее ${N(s.minAge)} лет, водительский стаж категории «B» — не менее ${N(s.minExp)} лет.</p>
<h2>2. Срок аренды, арендная плата и залог</h2>
<p>2.1. Срок аренды: с ${term(b.start)} по ${term(b.end)} (${days || '___'} ${plural(days || 5, ['сутки', 'суток', 'суток'])}). Одни сутки аренды — 24 часа с момента подписания акта передачи.</p>
<p>2.2. Арендная плата составляет ${N(b.price, '__________')} руб. в сутки.${num(b.discount) ? ` Скидка — ${groups(b.discount)} руб.` : ''} Сумма за весь срок — ${rent ? groups(rent) : '__________'} руб. Оплата вносится в размере 100 % до передачи Автомобиля.</p>
<p>2.3. Залог (обеспечительный платёж) составляет ${N(b.deposit, '__________')} руб. и вносится до передачи Автомобиля. Залог возвращается в течение ${N(s.depositDays)} календарных дней после возврата Автомобиля — этот срок нужен для проверки штрафов с камер. Из залога удерживаются суммы, которые Арендатор должен по договору: ущерб, штрафы, перепробег, зарядка, мойка, просрочка возврата.</p>
<p>2.4. Лимит пробега — ${num(car.kmLimit) ? groups(car.kmLimit) + ' км в сутки' : '___ км в сутки'}. Каждый километр сверх лимита оплачивается по ${N(car.overKm)} руб.</p>
<p>2.5. Продление аренды возможно по согласованию Сторон, если Арендатор сообщил об этом не позднее чем за ${N(s.prolongHours)} часов до окончания срока и оплатил новый период до его начала.</p>
<p>2.6. Просрочка возврата до ${N(s.graceMin)} минут не оплачивается. Далее — ${N(s.lateHour)} руб. за каждый полный или неполный час. Просрочка более ${N(s.lateFullDayHours)} часов оплачивается как полные сутки аренды.</p>
<p>2.7. При досрочном возврате Автомобиля арендная плата за неиспользованные сутки не возвращается, если Стороны не договорились иначе.</p>
<p>2.8. Оплата производится наличными (с распиской Арендодателя) или переводом на расчётный счёт Арендодателя, указанный в разделе 7. Днём оплаты считается день получения денег Арендодателем.</p>
<h2>3. Передача и возврат Автомобиля</h2>
<p>3.1. Передача и возврат Автомобиля оформляются актом приёма-передачи (Приложение 1), который подписывают обе Стороны. В акте фиксируются пробег, уровень заряда батареи, повреждения кузова и салона, комплектность. Фото и видео Автомобиля, сделанные при передаче и возврате, являются частью акта.</p>
<p>3.2. Место передачи и возврата: ${B(s.place, '________________________________')}, если Стороны не договорились иначе.</p>
<p>3.3. Автомобиль передаётся с зарядом батареи не менее ${N(s.chargeMin)} % и возвращается с зарядом не менее ${N(s.chargeMin)} %. За каждые недостающие 10 % заряда Арендатор платит ${N(s.chargePenalty)} руб.</p>
<p>3.4. Автомобиль возвращается в чистом виде. Если нужна мойка, Арендатор платит ${N(s.wash)} руб.; если нужна химчистка салона — ${N(s.dryClean)} руб.</p>
<p>3.5. Вместе с Автомобилем передаются:</p>
<ul><li>ключ-карта (NFC) — ${N(car.keys)} шт.;</li><li>свидетельство о регистрации ТС;</li><li>страховой полис (раздел 5);</li><li>зарядный кабель / адаптер — ${N(car.cables)} шт.;</li><li>комплект ковриков;</li><li>____________________.</li></ul>
<p>3.6. Недостатки, которые нельзя было заметить при осмотре, Арендатор сообщает Арендодателю в течение ${N(s.defectHours)} часов после передачи. Иначе считается, что Автомобиль передан без недостатков.</p>
<p>3.7. Автомобиль оснащён системой определения местоположения (GPS / телематика производителя). Арендатор уведомлён об этом и согласен, что Арендодатель видит местоположение Автомобиля в период аренды.</p>
<p>3.8. Если Арендатор не вернул Автомобиль и не выходит на связь более ${N(s.noContactHours)} часов после окончания срока аренды, Арендодатель вправе обратиться в полицию с заявлением о неправомерном завладении Автомобилем.</p>
<h2>4. Права и обязанности Сторон</h2>
<p>4.1. Арендодатель обязуется:</p>
<ul><li>передать Автомобиль в исправном состоянии, с документами и комплектностью по п. 3.5;</li><li>обеспечить действующий на территории использования полис страхования гражданской ответственности;</li><li>проводить плановое техническое обслуживание за свой счёт;</li><li>при поломке, возникшей не по вине Арендатора, заменить Автомобиль или вернуть арендную плату за дни простоя.</li></ul>
<p>4.2. Арендодатель вправе:</p>
<ul><li>проверять состояние Автомобиля в согласованное с Арендатором время;</li><li>требовать досрочного возврата Автомобиля при нарушении Арендатором условий договора;</li><li>удерживать из залога суммы, которые Арендатор должен по договору.</li></ul>
<p>4.3. Арендатор обязуется:</p>
<ul><li>соблюдать ПДД и использовать Автомобиль только по назначению (п. 1.4);</li><li>поддерживать Автомобиль в надлежащем состоянии в период аренды;</li><li>заряжать Автомобиль только на исправных зарядных станциях или штатным кабелем и не допускать разряда батареи ниже ${N(s.dischargeMin)} %;</li><li>оставлять Автомобиль запертым; не оставлять в салоне ключ-карту и документы;</li><li>оплачивать зарядку, платные парковки и платные дороги за период аренды;</li><li>сообщать Арендодателю о ДТП, поломке, угоне или эвакуации Автомобиля в течение 1 часа.</li></ul>
<p>4.4. Арендатору запрещается:</p>
<ul><li>передавать управление лицам, не указанным в акте приёма-передачи;</li><li>сдавать Автомобиль в субаренду, передавать в залог или иным образом распоряжаться им;</li><li>управлять Автомобилем в состоянии алкогольного, наркотического или иного опьянения, а также под действием лекарств, ухудшающих реакцию;</li><li>участвовать в гонках, дрифте, использовать режим старта с места (launch control) и трековые режимы;</li><li>буксировать другие транспортные средства и ездить по бездорожью;</li><li>курить в салоне (включая электронные сигареты), перевозить животных без переноски;</li><li>вносить изменения в конструкцию Автомобиля и его программное обеспечение, отвязывать аккаунт владельца, менять системные настройки и устанавливать обновления без согласия Арендодателя;</li><li>выезжать за пределы территории использования (п. 1.5) без согласия Арендодателя.</li></ul>
<h2>5. Ответственность и страхование</h2>
<p>5.1. С момента подписания акта передачи до подписания акта возврата Арендатор отвечает за сохранность Автомобиля и возмещает Арендодателю ущерб в полном объёме.</p>
<p>5.2. Размер ущерба определяется по калькуляции официального дилера, сертифицированного сервиса или независимой экспертизы. Кроме стоимости ремонта Арендатор оплачивает простой Автомобиля — арендную плату за каждый день ремонта, но не более ${N(s.idleMaxDays)} дней.</p>
<p>5.2.1. Все повреждения, выявленные при возврате Автомобиля и отмеченные в акте и на схеме осмотра (Приложение 1), Арендатор возмещает в день приёмки Автомобиля. Сумма возмещения указывается в акте возврата и может быть удержана из залога; недостающую часть Арендатор доплачивает в тот же день. Если точную стоимость ремонта нельзя определить в день приёмки, Арендатор вносит сумму по предварительной оценке Арендодателя, а после калькуляции по п. 5.2 Стороны делают перерасчёт в течение ${N(s.recalcDays)} дней.</p>
<p>5.3. За вред, причинённый Автомобилем третьим лицам в период аренды, отвечает Арендатор (ст. 648 ГК РФ).</p>
<p>5.4. Штрафы за нарушения ПДД, эвакуацию и неоплату парковки за период аренды оплачивает Арендатор. За обработку каждого штрафа Арендатор дополнительно платит ${N(s.fineFee)} руб. Арендодатель вправе удержать эти суммы из залога.</p>
<p>5.5. При ДТП Арендатор обязан не покидать место происшествия, оформить ДТП в установленном законом порядке и передать Арендодателю все полученные документы. Если вина третьего лица подтверждена документами ГИБДД или суда, Арендатор не возмещает ущерб Автомобилю. Если ДТП произошло по вине Арендатора или не оформлено надлежащим образом, Арендатор возмещает ущерб полностью.</p>
<p>5.6. Дополнительные платежи:</p>

<tr><td>Просрочка оплаты по договору, за каждый день</td><td>${N(s.penLatePayPct)} % от суммы долга</td></tr></table>
<p>5.7. Гражданская ответственность владельца Автомобиля застрахована ${osText}${ksText}</p>
<p>5.8. Если страховщик отказал в выплате из-за действий Арендатора (опьянение, управление лицом, не допущенным по договору, нарушение запретов п. 4.4), Арендатор возмещает ущерб в полном объёме.</p>
<p>5.9. Арендодатель не отвечает за вещи, оставленные Арендатором в Автомобиле.</p>
<h2>6. Расторжение, споры и прочие условия</h2>
<p>6.1. Договор может быть расторгнут досрочно по соглашению Сторон. Арендодатель вправе расторгнуть договор в одностороннем порядке, если Арендатор нарушил запреты п. 4.4, просрочил оплату более чем на ${N(s.termLatePayHours)} часов или указал недостоверные данные о себе. В этом случае Арендатор возвращает Автомобиль в течение ${N(s.termReturnHours)} часов с момента уведомления, а уплаченная арендная плата не возвращается.</p>
<p>6.2. Стороны освобождаются от ответственности за неисполнение договора, вызванное обстоятельствами непреодолимой силы, если сообщили о них другой Стороне в течение 24 часов.</p>
<p>6.3. К договору применяется законодательство Российской Федерации.</p>
<p>6.4. Споры Стороны решают переговорами. Срок ответа на письменную претензию — 10 календарных дней. Если спор не урегулирован, он передаётся в суд по правилам подсудности, установленным законодательством Российской Федерации.</p>
<p>6.5. Уведомления и согласования, направленные по телефонам и в мессенджеры, указанные в разделе 7, считаются надлежащими.</p>
<p>6.6. Арендатор даёт согласие Арендодателю на обработку своих персональных данных, указанных в договоре, для его исполнения, в том числе на их трансграничную передачу в ${B(s.companyCountry, 'страну регистрации Арендодателя').replace(/^Республика/, 'Республику')} и передачу в ГИБДД, страховую компанию и суд при необходимости.</p>
<p>6.7. Договор вступает в силу с момента подписания и действует до полного исполнения Сторонами своих обязательств. Договор составлен в двух экземплярах, по одному для каждой Стороны. Приложение 1 является неотъемлемой частью договора.</p>

function contractFileName(b, ext) {

}
function openContract(b) {
  const missing = [];
  const c = S.clients[b.clientId], car = S.cars[b.carId];
  if (!c) missing.push('клиент'); else { if (!c.passport || !c.passport.number) missing.push('паспорт клиента'); if (!c.license || !c.license.number) missing.push('права клиента'); }
  if (!car) missing.push('машина');
  if (!S.settings.companyName) missing.push('реквизиты в «Настройках»');
  const m = openModal({ title: `Договор №${esc(b.no || '—')}`, sub: missing.length ? `<span class="warn">Не заполнено: ${esc(missing.join(', '))} — в договоре останутся пропуски.</span>` : 'Договор и акт собраны из брони, клиента, машины и настроек.', size: 'wide',
    body: `<div class="paper-wrap"><div class="paper contract">${contractHTML(b)}</div></div>`,
    foot: `<span class="muted" style="font-size:12.5px">Пропуски «___» заполняются от руки при подписании.</span><span class="sp"></span><button class="btn" data-ct="html">Скачать HTML</button><button class="btn primary" data-ct="pdf">Скачать PDF</button>` });
  m.el.addEventListener('click', async e => {
    const a = e.target.closest('[data-ct]'); if (!a) return;
    a.disabled = true; const label = a.textContent; a.textContent = 'Готовлю…';
    try { if (a.dataset.ct === 'pdf') await savePDF(b); else await saveHTML(b); }
    finally { a.disabled = false; a.textContent = label; }
  });
}
async function getDl() { return APP_DL; }
function dlErr(e) {
  const c = e && e.code;
  if (c === 'declined') return;
  if (c === 'rate_limited') toast('Окно сохранения уже открыто', 'bad');
  else toast('Не удалось скачать файл' + (e && e.message ? ': ' + e.message : ''), 'bad');
}
async function saveHTML(b) {
  const dl = await getDl(); if (!dl) { toast('Скачивание недоступно в этом окне', 'bad'); return; }
  const css = [...document.styleSheets].flatMap(sh => { try { return [...sh.cssRules].map(r => r.cssText).filter(t => t.startsWith('.contract')); } catch (e) { return []; } }).join('\n');
  const doc = `<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>${esc(contractFileName(b, 'html'))}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap"><style>:root{--f-doc:"PT Serif","Times New Roman",Georgia,serif}@page{size:A4;margin:16mm 15mm 18mm 20mm}body{margin:0;background:#fff}${css}</style></head><body><div class="contract">${contractHTML(b)}</div></body></html>`;
  try { await dl.save({ filename: contractFileName(b, 'html'), data: doc }); toast('HTML готов — откройте в браузере и распечатайте'); } catch (e) { dlErr(e); }
}
function loadScript(src) {
  return new Promise((res, rej) => { if (window.html2pdf) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('не загрузилась библиотека PDF')); document.head.append(s); });
}
async function savePDF(b) {
  const dl = await getDl(); if (!dl) { toast('Скачивание недоступно в этом окне', 'bad'); return; }
  try {
    await loadScript(PDF_LIB);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const stage = $('#pdf-stage'); stage.innerHTML = `<div class="contract">${contractHTML(b)}</div>`;
    const el = stage.firstElementChild;
    const worker = window.html2pdf().set({
      margin: [14, 18, 16, 12], image: { type: 'jpeg', quality: 0.92 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', 'p', 'li', 'h2', 'h3', '.keep', '.schema'] }
    }).from(el).toPdf();
    const pdf = await worker.get('pdf');
    const n = pdf.internal.getNumberOfPages();
    for (let k = 1; k <= n; k++) { pdf.setPage(k); pdf.setFontSize(8); pdf.setTextColor(130); pdf.text(`${k} / ${n}`, 105, 291, { align: 'center' }); }
    const blob = pdf.output('blob');
    stage.innerHTML = '';
    await dl.save({ filename: contractFileName(b, 'pdf'), data: blob });
    toast('PDF готов');
  } catch (e) { if (e && e.code) dlErr(e); else { console.error(e); toast('PDF не собрался — скачайте HTML и распечатайте из браузера', 'bad'); } }
}

function setSync(text, off) { $$('.sync').forEach(el => { el.textContent = text; el.classList.toggle('off', !!off); }); }
const orgMark = name => esc((String(name || '?').trim()[0] || '?').toUpperCase());

  $$('.org-name').forEach(el => { el.textContent = S.org ? S.org.name : 'Прокат CRM'; });
  $$('.org-mark').forEach(el => { el.innerHTML = S.org ? orgMark(S.org.name) : ic('car'); });
  $$('.org-switch').forEach(el => { el.hidden = !multi; });
  $$('.brand[data-act="switch-org"]').forEach(el => { el.classList.toggle('can-switch', multi); el.setAttribute('aria-label', multi ? 'Сменить прокат' : ''); });
  document.title = S.org ? S.org.name + ' · CRM' : 'Прокат CRM';
