function renderMe() {
  $('#me').innerHTML = `${avatar(S.meName || S.meId, 'sm')}<span>${esc(S.meName || S.meId)}<small>${esc(ROLE[S.role] || '')}</small></span><button class="icon-btn" data-act="logout" aria-label="Выйти" title="Выйти">${ic('logout')}</button>`;
}
async function loadOrgs() {
  const [{ data: mine, error: e1 }, { data: orgs, error: e2 }] = await Promise.all([
    sb.from('staff').select('org_id,role,name').eq('email', S.meId),
    sb.from('orgs').select('id,name')
  ]);
  if (e1) throw e1; if (e2) throw e2;
  const names = Object.fromEntries((orgs || []).map(o => [o.id, o.name]));
  S.orgs = (mine || []).filter(m => names[m.org_id]).map(m => ({ id: m.org_id, name: names[m.org_id], role: m.role, myName: m.name || '' }))
    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  return S.orgs;
}
async function loadStaff() {
  const { data, error } = await sb.from('staff').select('org_id,email,name,role,reset,created_at').eq('org_id', S.org.id).order('created_at');
  if (error) throw error;
  S.staff = data || [];
  S.people = Object.fromEntries(S.staff.map(x => [x.email, { name: x.name || x.email }]));
  return S.staff.find(x => x.email === S.meId) || null;
}
async function loadAll() {
  const org = S.org && S.org.id; if (!org) return;
  const fresh = Object.fromEntries(COLLS.map(c => [c, {}])); let settings = {};
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('docs').select('coll,id,data').eq('org_id', org).order('coll').order('id').range(from, from + 999);
    if (error) throw error;
    (data || []).forEach(r => { if (r.coll === 'settings') { if (r.id === 'main') settings = r.data || {}; } else if (fresh[r.coll]) fresh[r.coll][r.id] = r.data || {}; });
    if (!data || data.length < 1000) break;
  }
  if (!S.org || S.org.id !== org) return; // switched company while loading
  COLLS.forEach(c => { S[c] = fresh[c]; });
  S.settings = settings; S.setStale = true; S.lastLoad = Date.now();
  if (S.dbState !== 'ok') { S.dbState = 'ok'; renderView(true); }
  schedule();
}
function applyRow(ev) {
  const del = ev.eventType === 'DELETE', r = del ? ev.old : ev.new;
  if (!r || !r.coll || !S.org || r.org_id !== S.org.id) return;
  if (r.coll === 'settings') { if (r.id === 'main') { S.settings = del ? {} : (r.data || {}); S.setStale = true; } }
  else if (S[r.coll]) { if (del) delete S[r.coll][r.id]; else S[r.coll][r.id] = r.data || {}; }
  schedule();
}
let chan = null;
function subscribe() {
  if (chan) { sb.removeChannel(chan); chan = null; }
  const org = S.org.id, f = 'org_id=eq.' + org;
  const onStaff = async () => {
    try {
      const me = await loadStaff();
      if (!me) { await loadOrgs().catch(() => {}); toast('Вас убрали из команды этого проката', 'bad'); leaveOrg(); return; }
      S.role = me.role; S.canWrite = me.role !== 'viewer'; S.meName = me.name || ''; renderMe(); refreshTeam(); schedule();
    } catch (e) { /* next sync will catch up */ }
  };
  chan = sb.channel('crm-' + org)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'docs', filter: f }, applyRow)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'docs', filter: f }, applyRow)
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'docs' }, applyRow)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'staff' }, ev => { const r = ev.new && ev.new.org_id ? ev.new : ev.old; if (!r || !r.org_id || r.org_id === org) onStaff(); })
    .subscribe(st => {
      if (!S.org || S.org.id !== org) return;
      if (st === 'SUBSCRIBED') { setSync('База синхронизирована'); if (S.resync) { S.resync = false; loadAll().catch(() => {}); } }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') { setSync('Нет связи — переподключаюсь…', true); S.resync = true; }
    });
}
const authBrand = () => `<div class="brand"><div class="mark" aria-hidden="true">${ic('car')}</div><div><b>Прокат CRM</b><small>Вход для сотрудников</small></div></div>`;

      ${isNew ? '<div class="fld"><label for="au_pass2">Повторите пароль</label><input id="au_pass2" type="password" autocomplete="new-password" required></div>' : ''}
      <div class="auth-err" id="au_err" role="alert">${esc(msg)}</div>
      <button class="btn primary" type="submit" id="au_go">${isNew ? 'Создать пароль и войти' : 'Войти'}</button>
    </form>
    ${isNew ? '' : '<p class="faint auth-foot">Забыли пароль? Попросите владельца проката нажать «Сбросить пароль» в «Настройки → Команда», затем откройте «Первый вход».</p>'}

  $$('[data-auth-mode]', el).forEach(b => b.addEventListener('click', () => { S.authEmail = $('#au_email').value.trim(); showAuth(b.dataset.authMode); }));
  const err = t => { $('#au_err').textContent = t; };
  $('#auth-form').addEventListener('submit', async e => {

    try {

        if (pw !== $('#au_pass2').value) throw new Error('Пароли не совпадают');
        const { error } = await sb.functions.invoke('register', { body: { email: em, password: pw, name: $('#au_name').value.trim() } });
        if (error) {
          let code = ''; try { code = (await error.context.json()).error; } catch (x) { /* no body */ }
          throw new Error({ not_in_team: 'Этой почты нет ни в одной команде. Попросите владельца проката добавить её в «Настройки → Команда».', exists: 'Пароль для этой почты уже создан — войдите на вкладке «Вход». Забыли — попросите владельца сбросить пароль.', short_password: 'Пароль — минимум 8 символов', bad_email: 'Проверьте почту' }[code] || 'Не получилось. Проверьте интернет и попробуйте ещё раз.');
