name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk prokat-crm.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest prokat-crm.apk \
            --title "Прокат CRM для Android (сборка ${{ github.run_number }})" \
            --notes "Установочный файл приложения для Android. Скачайте prokat-crm.apk на телефон и откройте его." \
            --latest
